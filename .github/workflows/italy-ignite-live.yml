name: Italy IGNITE live backup

on:
  schedule:
    # Start a second runner before the first runner's 5.5-hour limit.
    - cron: "20,35,50 6 27 9 *"
  push:
    paths:
      - .github/workflows/italy-ignite-live.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: italy-ignite-live
  cancel-in-progress: false

jobs:
  continuous-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check experiment window
        id: window
        run: |
          now=$(date -u +%s)
          cutoff=$(date -u -d '2026-09-27 12:00:00 UTC' +%s)
          if [ "$now" -lt "$cutoff" ]; then echo 'active=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"
      - name: Install browser
        if: steps.window.outputs.active == 'true'
        run: |
          python -m pip install playwright requests
          python -m playwright install --with-deps chromium
      - name: Capture every five minutes
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
        run: |
          end=$((SECONDS + 5 * 60 * 60 + 30 * 60))
          cutoff=$(date -u -d '2026-09-27 12:00:00 UTC' +%s)
          while [ "$SECONDS" -lt "$end" ] && [ "$(date -u +%s)" -lt "$cutoff" ]; do
            next=$((SECONDS + 300))
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ignite-found" --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)
            if [ "$count" -gt 0 ]; then export IGNITE_FOUND_BEFORE=true; fi
            python italy-ignite-monitor/monitor.py || echo 'Capture failed; retrying at the next interval.'
            remaining=$((next - SECONDS))
            if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          done
      - name: Save screenshots
        if: always() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: italy-jpop-live-${{ github.run_id }}
          path: italy-ignite-monitor/captures/
          if-no-files-found: warn
          retention-days: 7
      - name: Remember detection
        if: hashFiles('italy-ignite-monitor/ignite-found.flag') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ignite-found
          path: italy-ignite-monitor/ignite-found.flag
          retention-days: 7
